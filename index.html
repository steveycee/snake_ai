<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snake (Canvas)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game">
      <canvas
        id="game"
        width="400"
        height="400"
        aria-label="Snake game"
      ></canvas>

      <div class="hud">
        <div id="score">Score: 0</div>
        <button id="start">Start / Restart</button>
      </div>

      <!-- Mobile on-screen controls -->
      <div id="controls" class="controls" aria-hidden="true">
        <button data-dir="up" class="ctl up" aria-label="Up">▲</button>
        <div class="ctl-row">
          <button data-dir="left" class="ctl left" aria-label="Left">◀</button>
          <button id="mobile-start" class="ctl start" aria-label="Start">Start</button>
          <button data-dir="right" class="ctl right" aria-label="Right">▶</button>
        </div>
        <button data-dir="down" class="ctl down" aria-label="Down">▼</button>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
