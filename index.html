<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snake (Canvas)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game">
      <div class="canvas-wrap">
        <canvas
          id="game"
          width="400"
          height="400"
          aria-label="Snake game"
        ></canvas>

        <div class="game-feedback hidden" id="game-feedback" aria-live="polite">
          <div class="feedback-title">Game Over: Final Score 0</div>
        </div>
      </div>

      <div class="hud"></div>

      <!-- Mobile on-screen controls -->
      <div id="controls" class="controls" aria-hidden="true">
        <div class="mobile-grid">
          <button id="mobile-start" class="ctl start" aria-label="Start">Start</button>
          <button data-dir="up" class="ctl up direction" aria-label="Up">▲</button>
          <button id="mobile-pause" class="ctl pause" aria-label="Pause">Pause</button>

          <button data-dir="left" class="ctl left direction" aria-label="Left">◀</button>
          <button id="score" class="ctl score" aria-label="Score">Score: 0</button>
          <button data-dir="right" class="ctl right direction" aria-label="Right">▶</button>

          <button class="ctl blank" aria-label="Blank" tabindex="-1"></button>
          <button data-dir="down" class="ctl down direction" aria-label="Down">▼</button>
          <button class="ctl blank" aria-label="Blank" tabindex="-1"></button>
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
